<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>娃衣小筑 · 给娃娃一件心动小衣裳</title>
  <link rel="stylesheet" href="style.css?v=12">
  <link rel="stylesheet" href="font-fix.css">
  <link rel="stylesheet" href="wardrobe.css?v=20261118-landing">
  <link rel="stylesheet" href="landing.css?v=20261118">
  <script defer src="notebook.js?v=20261118-landing"></script>
</head>
<body class="landing">
  <main class="landing-main">
    <section class="landing-hero" aria-labelledby="landing-title">
      <div class="landing-intro">
        <p class="landing-brand"><img src="assets/companion.svg" alt="">娃衣小筑</p>
        <h1 class="outlined" id="landing-title">
          <span class="edge outer" aria-hidden="true">给娃娃，<br>一件心动小衣裳</span>
          <span class="edge inner" aria-hidden="true">给娃娃，<br>一件心动小衣裳</span>
          <span class="ink">给娃娃，<br>一件心动小衣裳</span>
        </h1>
        <p>设计娃衣，查看细节，轻松沟通定制。</p>
        <div class="landing-actions">
          <button type="button" id="launch-atelier" aria-haspopup="dialog">开始设计 <span aria-hidden="true">↗</span></button>
          <button type="button" id="launch-profile" aria-haspopup="dialog">新建娃娃档案</button>
        </div>
      </div>
      <div class="landing-photos" role="group" aria-label="娃衣设计示例">
        <div class="landing-photo cotton" role="img" aria-label="奶油蕾丝娃衣，棉花娃娃设计示意"></div>
        <div class="landing-photo bjd" role="img" aria-label="柔粉花边娃衣，BJD设计示意"></div>
      </div>
    </section>
  </main>
  <dialog id="panel" class="home-atelier" aria-labelledby="home-atelier-title">
    <div class="home-atelier-bar">
      <h2 id="home-atelier-title">娃娃衣柜</h2>
      <button class="close wardrobe-close" type="button" aria-label="关闭工作台">×</button>
    </div>
    <iframe id="atelier-frame" title="娃娃档案和衣柜工作台"></iframe>
  </dialog>
</body>
</html>
