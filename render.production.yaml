# PAID example, NOT automatically deployed. Review the plan/disk price in Render before use.
# If using a Blueprint, explicitly select this filename, or rename a COPY to render.yaml.
services:
  - type: web
    name: dollfit
    runtime: python
    plan: 1c-2g
    rootDir: dollfit
    buildCommand: pip install -r requirements.txt && python -m deployment.assets restore
    startCommand: python -m deployment.start
    healthCheckPath: /healthz
    disk:
      name: dollfit-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: INVITE_CODE
        sync: false
      - key: ADMIN_USERNAME
        value: owner
      - key: ADMIN_PASSWORD
        sync: false
      - key: HEJU_API_KEY
        sync: false
      - key: TRIPO_API_KEY
        sync: false
      - key: TRIPO_PROVIDER
        value: seller
      - key: DATA_DIR
        value: /var/data/dollfit
      - key: DATA_EPHEMERAL
        value: "false"
